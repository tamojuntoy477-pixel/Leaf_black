name: Build Leaf Black GBA

on:
  workflow_dispatch:
  push:
    paths:
      - "src/**"
      - "Makefile"
      - ".github/workflows/build-gba.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build GBA ROM
        run: |
          docker run --rm -v "$PWD:/work" -w /work devkitpro/devkitarm:latest bash -lc "pacman -S --noconfirm gba-dev >/dev/null && make"
      - name: Upload ROM artifact
        uses: actions/upload-artifact@v4
        with:
          name: leaf-black-gba-prototype
          path: leafblack.gba
